name: Signed release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v1.0.${{ github.run_number }}

jobs:
  signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cortexbridge.keystore"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PsigningStoreFile="$RUNNER_TEMP/cortexbridge.keystore" \
            -PsigningStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -PsigningKeyPassword="$ANDROID_KEY_PASSWORD" \
            --stacktrace

      - name: Publish signed release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: CortexBridge ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
