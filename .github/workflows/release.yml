name: Release on main change

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v0.1.${{ github.run_number }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build installable debug APK
        run: |
          set -o pipefail
          gradle test assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk "CortexBridge-${RELEASE_VERSION}-debug.apk"

      - name: Add build diagnostics to summary
        if: failure()
        run: |
          echo '## CortexBridge build diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -300 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: CortexBridge ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: true
          files: |
            CortexBridge-${{ env.RELEASE_VERSION }}-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
