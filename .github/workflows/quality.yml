name: Kotlin quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Detekt, KtLint and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run Detekt and KtLint
        run: gradle detekt ktlintCheck --stacktrace

      - name: Validate documentation
        run: |
          test -s README.md
          test -s app/src/main/AndroidManifest.xml
          grep -q "CortexBridge" README.md
          grep -q "android:icon" app/src/main/AndroidManifest.xml
